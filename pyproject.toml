[project]
name = "backplane"
version = "0.1.0"
description = "Shared host runtime for small Windows tray utilities"
requires-python = ">=3.10"
dependencies = [
    "pystray>=0.19",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backplane*"]
